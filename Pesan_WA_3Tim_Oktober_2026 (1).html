const TEAMS = ["Team East+West", "Team Central+West", "Team Yourise (MIX AREA)"];
const PESERTA = [{"team": "Team East+West", "nama": "Renaldi Triharsono"}, {"team": "Team East+West", "nama": "Farhat Ridwan Pratama"}, {"team": "Team East+West", "nama": "Riko Ardiansyah"}, {"team": "Team Central+West", "nama": "Abdullah Malik Farihin"}, {"team": "Team Central+West", "nama": "Salma Puji Sa'ban"}, {"team": "Team Central+West", "nama": "Siti Arfiah"}, {"team": "Team Yourise (MIX AREA)", "nama": "Aisyah Alidawati"}, {"team": "Team Yourise (MIX AREA)", "nama": "Dewi Santika"}];

const TEAM_COLOR = {'Team East+West':'#1E6B33', 'Team Central+West':'#1A5C99', 'Team Yourise (MIX AREA)':'#B38600'};
const TEAM_SHORT = {'Team East+West':'East+West', 'Team Central+West':'Central+West', 'Team Yourise (MIX AREA)':'Yourise MIX'};

let mode = 'opening';
let state = { team: TEAMS[0], hari: 1, nama: PESERTA.find(p=>p.team===TEAMS[0]).nama };

function daysForGroup(team){ return GROUP.filter(d=>d.team===team).map(d=>({hari:d.hari, tanggal:d.tanggal})); }
function personsForTeam(team){ return PESERTA.filter(p=>p.team===team).map(p=>p.nama); }
function daysForPerson(nama){ return PERSONAL.filter(d=>d.peserta===nama).map(d=>({hari:d.hari, tanggal:d.tanggal})); }
function shortDate(tanggal){ return tanggal.split(', ')[1].replace(' 2026','').replace('Oktober','Okt'); }

function selectMode(m){
  mode = m;
  document.getElementById('modeOpeningTab').classList.toggle('active', m==='opening');
  document.getElementById('modeGroupTab').classList.toggle('active', m==='group');
  document.getElementById('modePersonalTab').classList.toggle('active', m==='personal');
  document.getElementById('openingView').classList.toggle('hidden', m!=='opening');
  document.getElementById('groupView').classList.toggle('hidden', m!=='group');
  document.getElementById('personalView').classList.toggle('hidden', m!=='personal');
  const foot = {
    opening: 'Kirim pesan ini sekali di awal, sebelum jadwal harian mulai — tempel ke Group WhatsApp tim masing-masing.',
    group: 'Tekan "Salin Pesan" lalu tempel ke Group WhatsApp tim setiap pagi sesuai harinya.',
    personal: 'Tekan "Salin Pesan" lalu tempel ke chat pribadi (japri) WhatsApp peserta terkait.'
  };
  document.getElementById('footerText').textContent = foot[m];
  if(mode==='personal'){ state.nama = personsForTeam(state.team)[0]; }
  renderAll();
}

function renderTeamTabs(){
  const el = document.getElementById('teamTabs');
  el.innerHTML = TEAMS.map((t,i) => `
    <div class="team-tab ${t===state.team?'active':''}" data-team="${t}" onclick="selectTeamIndex(${i})">${TEAM_SHORT[t]}</div>`).join('');
}
function selectTeamIndex(i){ selectTeam(TEAMS[i]); }
function selectTeam(t){
  state.team=t;
  if(mode==='group'){ state.hari = daysForGroup(t)[0].hari; }
  else if(mode==='personal'){ state.nama = personsForTeam(t)[0]; state.hari = daysForPerson(state.nama)[0].hari; }
  renderAll();
}

/* ---- OPENING ---- */
function renderCardOpening(){
  const msg = OPENING.find(d => d.team===state.team);
  const color = TEAM_COLOR[state.team];
  document.getElementById('cardOpening').innerHTML = `
    <div class="card-head" style="background:${color}"><div>${msg.team} — ${msg.label}<span class="sub">Pesan pembukaan tim</span></div><div style="font-size:20px">🎉</div></div>
    <div class="bubble-wrap"><div class="bubble">${escapeHtml(msg.pesan)}</div></div>
    <div class="copy-row"><button class="copy-btn" id="copyBtnO" style="background:${color}" onclick="copyOpening()">📋 Salin Pesan</button></div>`;
}
function copyOpening(){
  const msg = OPENING.find(d => d.team===state.team);
  navigator.clipboard.writeText(msg.pesan).then(()=>{
    const btn = document.getElementById('copyBtnO');
    btn.classList.add('copied'); btn.innerHTML = '✅ Tersalin!';
    setTimeout(()=>{ btn.classList.remove('copied'); btn.innerHTML='📋 Salin Pesan'; }, 1800);
  });
}

/* ---- GROUP ---- */
function renderDayPillsG(){
  const el = document.getElementById('dayScrollG');
  const days = daysForGroup(state.team);
  el.innerHTML = days.map(d => `
    <div class="day-pill ${d.hari===state.hari?'active':''}" data-team="${state.team}"
         onclick="selectDayG(${d.hari})">H${d.hari}<br><span style="font-weight:400">${shortDate(d.tanggal)}</span></div>`).join('');
}
function selectDayG(h){ state.hari=h; renderDayPillsG(); renderCardGroup(); }
function renderCardGroup(){
  const msg = GROUP.find(d => d.team===state.team && d.hari===state.hari);
  const color = TEAM_COLOR[state.team];
  document.getElementById('cardGroup').innerHTML = `
    <div class="card-head" style="background:${color}"><div>${msg.tanggal}<span class="sub">${msg.team} · Pulau: ${msg.pulau}</span></div><div style="font-size:20px">💬</div></div>
    <div class="bubble-wrap"><div class="bubble">${escapeHtml(msg.pesan)}</div></div>
    <div class="copy-row"><button class="copy-btn" id="copyBtnG" style="background:${color}" onclick="copyGroup()">📋 Salin Pesan</button></div>`;
}
function copyGroup(){
  const msg = GROUP.find(d => d.team===state.team && d.hari===state.hari);
  navigator.clipboard.writeText(msg.pesan).then(()=>{
    const btn = document.getElementById('copyBtnG');
    btn.classList.add('copied'); btn.innerHTML = '✅ Tersalin!';
    setTimeout(()=>{ btn.classList.remove('copied'); btn.innerHTML='📋 Salin Pesan'; }, 1800);
  });
}

/* ---- PERSONAL ---- */
function renderPersonPills(){
  const el = document.getElementById('personScroll');
  const list = personsForTeam(state.team);
  el.innerHTML = list.map((nm,i) => `
    <div class="person-pill ${nm===state.nama?'active':''}" data-team="${state.team}"
         onclick="selectPersonIndex(${i})">${escapeHtml(nm)}</div>`).join('');
}
function selectPersonIndex(i){ const nm = personsForTeam(state.team)[i]; selectPerson(nm); }
function selectPerson(nm){ state.nama=nm; state.hari = daysForPerson(nm)[0].hari; renderPersonPills(); renderDayPillsP(); renderCardPersonal(); }
function renderDayPillsP(){
  const el = document.getElementById('dayScrollP');
  const days = daysForPerson(state.nama);
  el.innerHTML = days.map(d => `
    <div class="day-pill ${d.hari===state.hari?'active':''}" data-team="${state.team}"
         onclick="selectDayP(${d.hari})">H${d.hari}<br><span style="font-weight:400">${shortDate(d.tanggal)}</span></div>`).join('');
}
function selectDayP(h){ state.hari=h; renderDayPillsP(); renderCardPersonal(); }
function renderCardPersonal(){
  const msg = PERSONAL.find(d => d.peserta===state.nama && d.hari===state.hari);
  const color = TEAM_COLOR[state.team];
  document.getElementById('cardPersonal').innerHTML = `
    <div class="card-head" style="background:${color}"><div>${msg.peserta}<span class="sub">${msg.tanggal} · Pulau: ${msg.pulau}</span></div><div style="font-size:20px">🙋</div></div>
    <div class="bubble-wrap"><div class="bubble">${escapeHtml(msg.pesan)}</div></div>
    <div class="copy-row"><button class="copy-btn" id="copyBtnP" style="background:${color}" onclick="copyPersonal()">📋 Salin Pesan</button></div>`;
}
function copyPersonal(){
  const msg = PERSONAL.find(d => d.peserta===state.nama && d.hari===state.hari);
  navigator.clipboard.writeText(msg.pesan).then(()=>{
    const btn = document.getElementById('copyBtnP');
    btn.classList.add('copied'); btn.innerHTML = '✅ Tersalin!';
    setTimeout(()=>{ btn.classList.remove('copied'); btn.innerHTML='📋 Salin Pesan'; }, 1800);
  });
}

function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderAll(){
  renderTeamTabs();
  if(mode==='opening'){ renderCardOpening(); }
  else if(mode==='group'){ renderDayPillsG(); renderCardGroup(); }
  else { renderPersonPills(); renderDayPillsP(); renderCardPersonal(); }
}
renderAll();

</script>
